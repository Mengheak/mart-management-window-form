services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql1
    hostname: sql1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Heak020507#"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sqlnet

  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: sql1
      LABEL_sql1: SQL Server 2025 (Docker)
      SERVER_sql1: sqlserver
      USER_sql1: sa
      PASSWORD_sql1: "Heak020507#"
      # Container-to-container over the sqlnet bridge, so this stays 1433 regardless of
      # which host port the server is published on.
      PORT_sql1: 1433
      ENGINE_sql1: mssql@dbgate-plugin-mssql
    ports:
      - "3033:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - sqlnet

volumes:
  sql_data:
  dbgate_data:

networks:
  sqlnet:
    driver: bridge

